name: Thread
options:
  bundleIdPrefix: com.sumonmondal
  generateSharedSchemes: true
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PQ3966J4X9
targets:
  ThreadApp:
    type: application
    platform: iOS
    sources:
      - path: ios/ThreadApp
      - path: ios/ThreadWidget/ThreadActivityAttributes.swift
    configFiles:
      Debug: ios/Config/Base.xcconfig
      Release: ios/Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sumonmondal.ThreadApp
        INFOPLIST_FILE: ios/ThreadApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thread
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Thread uses your microphone to transcribe meetings and detect action items in real-time."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Thread uses speech recognition to convert speech into text for meeting intelligence."
    dependencies:
      - target: ThreadWidget
  ThreadWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/ThreadWidget
    info:
      path: ios/ThreadWidget/Info.plist
      properties:
        CFBundleDisplayName: Thread
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sumonmondal.ThreadApp.Widget
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

schemes:
  ThreadApp:
    build:
      targets:
        ThreadApp: all
        ThreadWidget: all
    run:
      config: Debug

